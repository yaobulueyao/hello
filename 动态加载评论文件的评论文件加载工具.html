<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动态加载评论文件的评论文件加载工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        
        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #1a2980;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .comment-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d0d9ff;
            word-break: break-word;
        }
        
        .type-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .type-btn {
            background: linear-gradient(90deg, #3a4a9c, #4abdc5);
            color: white;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .type-btn:active {
            transform: scale(0.95);
        }
        
        .type-btn.active {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
        }
        
        .copy-btn {
            background: linear-gradient(90deg, #1a2980, #26d0ce);
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            width: 100%;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .copy-btn:active {
            transform: scale(0.95);
        }
        
        .copy-btn.copied {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }
        
        .info-text {
            margin-top: 10px;
            color: #666;
            font-size: 0.85rem;
            min-height: 20px;
        }
        
        .control-panel {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border: 2px dashed #d0d9ff;
        }
        
        .control-section {
            margin-bottom: 20px;
        }
        
        .control-title {
            color: #1a2980;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .url-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #d0d9ff;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        
        .url-input:focus {
            outline: none;
            border-color: #1a2980;
        }
        
        .control-btn {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            outline: none;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .control-btn.blue {
            background: linear-gradient(90deg, #3498db, #2980b9);
        }
        
        .control-btn.green {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }
        
        .hint-text {
            color: #666;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        .tip {
            margin-top: 15px;
            color: #999;
            font-size: 0.8rem;
        }
        
        .hidden {
            display: none;
        }
        
        .status-text {
            color: #666;
            font-size: 0.85rem;
            margin-top: 5px;
            min-height: 20px;
        }
        
        .file-list {
            margin-top: 10px;
            text-align: left;
            color: #666;
            font-size: 0.85rem;
        }
        
        .file-item {
            margin-bottom: 5px;
            padding: 5px;
            background: #f0f7ff;
            border-radius: 5px;
        }
        
        .copy-success {
            animation: copySuccess 0.3s ease;
        }
        
        @keyframes copySuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* 移动端优化 */
        input, button, [role="button"] {
            font-size: 16px;
            touch-action: manipulation;
        }
        
        button, .type-btn, .control-btn, .copy-btn {
            min-height: 44px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>动态加载评论文件的评论文件加载工具</h1>
        
        <div class="comment-box" id="comment-box">加载评论文件后，选择类型并复制评论</div>
        
        <div class="type-buttons" id="type-buttons">
            <!-- 类型按钮将在这里动态生成 -->
        </div>
        
        <button class="copy-btn" id="copy-btn" type="button">点击复制评论</button>
        <div class="info-text" id="info-text">请先加载评论文件并选择类型</div>
        
        <div class="control-panel">
            <!-- 远程URL加载 -->
            <div class="control-section">
                <div class="control-title">1. 远程URL加载</div>
                <input type="text" class="url-input" id="url-input" placeholder="输入评论文件URL" inputmode="url">
                <button class="control-btn blue" id="load-url-btn" type="button">从URL加载评论</button>
                <div class="hint-text">支持.txt文件，每行一条评论，文件名作为类型名称</div>
            </div>
            
            <!-- 文件上传 -->
            <div class="control-section">
                <div class="control-title">2. 文件上传</div>
                <button class="control-btn" id="upload-btn" type="button">上传评论文件</button>
                <input type="file" id="file-input" class="hidden" accept=".txt" multiple>
                <div class="hint-text">支持.txt文件，可多选，文件名作为类型名称</div>
            </div>
            
            <!-- 自动加载本地文件 -->
            <div class="control-section">
                <div class="control-title">3. 自动加载本地文件</div>
                <button class="control-btn green" id="load-local-btn" type="button">自动加载本地文件</button>
                <div class="hint-text">自动加载同目录下的comment_*.txt文件（动态扫描）</div>
            </div>
            
            <div class="status-text" id="status-text">请选择一种方式加载评论文件</div>
        </div>
        
        <div class="tip">随机不重复，用完自动重置，随机添加表情符号，复制后可在任意聊天框粘贴使用</div>
    </div>

    <script>
        // 表情符号库
        const emojis = ["[666]", "[火]", "[赞]", "[玫瑰]", "[爱心]", "[优秀]", "[鼓掌]", "[礼物]"];
        
        // 当前选中的类型
        let currentType = null;
        // 评论库
        let commentLibraries = {};
        // 已使用的评论索引
        let usedComments = {};
        
        document.addEventListener('DOMContentLoaded', function() {
            const commentBox = document.getElementById('comment-box');
            const copyBtn = document.getElementById('copy-btn');
            const infoText = document.getElementById('info-text');
            const typeButtons = document.getElementById('type-buttons');
            const statusText = document.getElementById('status-text');
            const loadUrlBtn = document.getElementById('load-url-btn');
            const urlInput = document.getElementById('url-input');
            const uploadBtn = document.getElementById('upload-btn');
            const fileInput = document.getElementById('file-input');
            const loadLocalBtn = document.getElementById('load-local-btn');
            
            // 检测是否为移动设备
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            // 更新状态文本
            function updateStatus(message) {
                statusText.textContent = message;
            }
            
            // 从文件名提取类型名称
            function getTypeNameFromFileName(fileName) {
                const nameWithoutExt = fileName.replace(/\.txt$/i, '');
                return nameWithoutExt.replace(/^comment_/i, '');
            }
            
            // 解析评论内容
            function parseComments(content, fileName) {
                const comments = content.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0);
                
                if (comments.length === 0) {
                    return null;
                }
                
                return {
                    type: getTypeNameFromFileName(fileName),
                    comments: comments
                };
            }
            
            // 添加评论库
            function addCommentLibrary(type, comments) {
                commentLibraries[type] = comments;
                usedComments[type] = [];
            }
            
            // 创建类型按钮
            function createTypeButtons() {
                typeButtons.innerHTML = '';
                const types = Object.keys(commentLibraries);
                
                if (types.length === 0) {
                    return;
                }
                
                types.forEach(type => {
                    const btn = document.createElement('button');
                    btn.className = 'type-btn';
                    if (type === currentType) {
                        btn.classList.add('active');
                    }
                    btn.dataset.type = type;
                    btn.textContent = getDisplayName(type);
                    btn.type = 'button';
                    
                    // 设置点击事件
                    btn.addEventListener('click', () => handleTypeSelect(type));
                    setupMobileTouchEvents(btn, () => handleTypeSelect(type));
                    
                    typeButtons.appendChild(btn);
                });
                
                if (!currentType && types.length > 0) {
                    currentType = types[0];
                    const firstBtn = document.querySelector('.type-btn');
                    if (firstBtn) {
                        firstBtn.classList.add('active');
                    }
                }
            }
            
            // 获取显示名称
            function getDisplayName(type) {
                const nameMap = {
                    'general': '通用',
                    'game': '游戏',
                    'stock': '股票',
                    'car': '汽车',
                    'food': '美食',
                    'tech': '科技',
                    'sports': '体育',
                    'music': '音乐',
                    'movie': '电影',
                    'travel': '旅游',
                    'education': '教育',
                    'health': '健康',
                    'fashion': '时尚',
                    'finance': '财经',
                    'news': '新闻',
                    'entertainment': '娱乐',
                    'technology': '科技',
                    'business': '商业',
                    'lifestyle': '生活'
                };
                return nameMap[type] || type;
            }
            
            // 从远程URL加载文件
            async function loadFromUrl(url) {
                try {
                    updateStatus('正在从URL加载评论文件...');
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const content = await response.text();
                    const fileName = url.split('/').pop() || 'comments.txt';
                    const parsed = parseComments(content, fileName);
                    
                    if (!parsed) {
                        updateStatus('评论文件内容为空');
                        return false;
                    }
                    
                    addCommentLibrary(parsed.type, parsed.comments);
                    createTypeButtons();
                    updateStatus(`成功从URL加载: ${fileName} (${parsed.comments.length}条评论)`);
                    
                    if (Object.keys(commentLibraries).length === 1) {
                        handleTypeSelect(parsed.type);
                    }
                    
                    return true;
                } catch (error) {
                    updateStatus(`URL加载失败: ${error.message}`);
                    return false;
                }
            }
            
            // 处理文件上传
            function handleFileUpload(files) {
                if (files.length === 0) {
                    return;
                }
                
                updateStatus(`正在处理${files.length}个文件...`);
                
                let filesProcessed = 0;
                let successCount = 0;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (!file.name.endsWith('.txt')) {
                        filesProcessed++;
                        if (filesProcessed === files.length) {
                            updateStatus(`处理完成，成功加载${successCount}个文件`);
                        }
                        continue;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const content = e.target.result;
                        const parsed = parseComments(content, file.name);
                        
                        if (parsed) {
                            addCommentLibrary(parsed.type, parsed.comments);
                            successCount++;
                        }
                        
                        filesProcessed++;
                        
                        if (filesProcessed === files.length) {
                            if (successCount > 0) {
                                createTypeButtons();
                                updateStatus(`处理完成，成功加载${successCount}个文件`);
                                
                                if (Object.keys(commentLibraries).length === successCount) {
                                    const firstType = Object.keys(commentLibraries)[0];
                                    handleTypeSelect(firstType);
                                }
                            } else {
                                updateStatus('没有找到有效的评论文件');
                            }
                        }
                    };
                    
                    reader.onerror = function() {
                        filesProcessed++;
                        if (filesProcessed === files.length) {
                            updateStatus(`处理完成，成功加载${successCount}个文件`);
                        }
                    };
                    
                    reader.readAsText(file);
                }
            }
            
            // 动态扫描并加载本地文件
            function loadLocalFiles() {
                updateStatus('正在动态扫描同目录下的评论文件...');
                
                // 获取当前页面的目录路径
                const currentPath = window.location.href;
                const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                
                // 先尝试扫描常见的评论文件名模式
                const filePatterns = [
                    'comment_*.txt',
                    'comments_*.txt',
                    '*.txt'
                ];
                
                let loadedCount = 0;
                let foundFiles = new Set(); // 用于去重
                
                // 首先尝试获取目录列表
                fetchDirectoryListing(basePath)
                    .then(files => {
                        if (files && files.length > 0) {
                            // 过滤出评论文件
                            const commentFiles = files.filter(file => 
                                file.match(/^comment_.*\.txt$/i) || 
                                file.match(/^comments_.*\.txt$/i)
                            );
                            
                            if (commentFiles.length > 0) {
                                updateStatus(`找到 ${commentFiles.length} 个评论文件，正在加载...`);
                                loadCommentFiles(commentFiles, basePath);
                            } else {
                                updateStatus('未找到 comment_*.txt 格式的文件，尝试扫描所有txt文件...');
                                const txtFiles = files.filter(file => file.endsWith('.txt'));
                                if (txtFiles.length > 0) {
                                    loadCommentFiles(txtFiles, basePath);
                                } else {
                                    updateStatus('未找到任何.txt文件');
                                }
                            }
                        } else {
                            // 如果无法获取目录列表，尝试加载常见的评论文件
                            tryLoadCommonFiles();
                        }
                    })
                    .catch(() => {
                        // 如果获取目录失败，尝试加载常见的评论文件
                        tryLoadCommonFiles();
                    });
                
                // 获取目录列表
                async function fetchDirectoryListing(path) {
                    try {
                        const response = await fetch(path);
                        if (!response.ok) {
                            return null;
                        }
                        
                        const html = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const links = doc.querySelectorAll('a');
                        
                        const files = [];
                        links.forEach(link => {
                            const href = link.getAttribute('href');
                            if (href && !href.startsWith('/') && !href.startsWith('http') && href !== '../') {
                                files.push(href);
                            }
                        });
                        
                        return files;
                    } catch (error) {
                        return null;
                    }
                }
                
                // 加载评论文件
                function loadCommentFiles(files, basePath) {
                    files.forEach(fileName => {
                        if (foundFiles.has(fileName)) {
                            return; // 跳过已加载的文件
                        }
                        
                        const fileUrl = basePath + fileName;
                        
                        fetch(fileUrl)
                            .then(response => {
                                if (response.ok) {
                                    return response.text();
                                }
                                return null;
                            })
                            .then(content => {
                                if (content) {
                                    const parsed = parseComments(content, fileName);
                                    if (parsed) {
                                        addCommentLibrary(parsed.type, parsed.comments);
                                        foundFiles.add(fileName);
                                        loadedCount++;
                                    }
                                }
                            })
                            .catch(() => {})
                            .finally(() => {
                                // 当所有文件都尝试加载后
                                if (foundFiles.size === files.length) {
                                    if (loadedCount > 0) {
                                        createTypeButtons();
                                        updateStatus(`自动加载完成，成功加载 ${loadedCount} 个本地文件`);
                                        
                                        if (loadedCount > 0) {
                                            const firstType = Object.keys(commentLibraries)[0];
                                            handleTypeSelect(firstType);
                                        }
                                    } else {
                                        updateStatus('未找到可加载的评论文件');
                                    }
                                }
                            });
                    });
                }
                
                // 尝试加载常见文件
                function tryLoadCommonFiles() {
                    updateStatus('尝试加载常见的评论文件...');
                    
                    const commonFiles = [
                        'comment_general.txt',
                        'comment_game.txt',
                        'comment_stock.txt',
                        'comment_car.txt',
                        'comment_food.txt',
                        'comment_tech.txt',
                        'comments_general.txt',
                        'comments_game.txt',
                        'comments_stock.txt',
                        'comments_car.txt',
                        'comments_food.txt',
                        'comments_tech.txt'
                    ];
                    
                    let attemptedCount = 0;
                    loadedCount = 0;
                    
                    commonFiles.forEach(fileName => {
                        const fileUrl = basePath + fileName;
                        
                        fetch(fileUrl)
                            .then(response => {
                                if (response.ok) {
                                    return response.text();
                                }
                                return null;
                            })
                            .then(content => {
                                if (content) {
                                    const parsed = parseComments(content, fileName);
                                    if (parsed) {
                                        addCommentLibrary(parsed.type, parsed.comments);
                                        loadedCount++;
                                    }
                                }
                            })
                            .catch(() => {})
                            .finally(() => {
                                attemptedCount++;
                                if (attemptedCount === commonFiles.length) {
                                    if (loadedCount > 0) {
                                        createTypeButtons();
                                        updateStatus(`自动加载完成，成功加载 ${loadedCount} 个本地文件`);
                                        
                                        if (loadedCount > 0) {
                                            const firstType = Object.keys(commentLibraries)[0];
                                            handleTypeSelect(firstType);
                                        }
                                    } else {
                                        updateStatus('未找到本地评论文件，请使用其他方式加载');
                                    }
                                }
                            });
                    });
                }
            }
            
            // 获取当前类型剩余的评论数量
            function getRemainingCount(type) {
                if (!commentLibraries[type]) {
                    return 0;
                }
                const totalCount = commentLibraries[type].length;
                const usedCount = usedComments[type] ? usedComments[type].length : 0;
                return totalCount - usedCount;
            }
            
            // 随机向评论中添加表情符号
            function addRandomEmojis(text) {
                const numEmojis = Math.floor(Math.random() * 4);
                if (numEmojis === 0) return text;
                
                const selectedEmojis = [];
                for (let i = 0; i < numEmojis; i++) {
                    selectedEmojis.push(emojis[Math.floor(Math.random() * emojis.length)]);
                }
                
                const words = text.split('');
                const result = [];
                const insertPositions = [];
                
                for (let i = 0; i < selectedEmojis.length; i++) {
                    insertPositions.push({
                        position: Math.floor(Math.random() * (words.length + 1)),
                        emoji: selectedEmojis[i]
                    });
                }
                
                insertPositions.sort((a, b) => a.position - b.position);
                let currentPosition = 0;
                
                for (let i = 0; i < insertPositions.length; i++) {
                    const {position, emoji} = insertPositions[i];
                    for (let j = currentPosition; j < position && j < words.length; j++) {
                        result.push(words[j]);
                    }
                    result.push(emoji);
                    currentPosition = position;
                }
                
                for (let j = currentPosition; j < words.length; j++) {
                    result.push(words[j]);
                }
                
                return result.join('');
            }
            
            // 获取不重复的随机评论
            function getUniqueComment(type) {
                if (!commentLibraries[type]) {
                    return "请先加载评论文件";
                }
                
                const comments = commentLibraries[type];
                const used = usedComments[type] || [];
                
                if (used.length >= comments.length) {
                    usedComments[type] = [];
                    updateInfoText();
                    
                    if (comments.length > 0) {
                        const randomIndex = Math.floor(Math.random() * comments.length);
                        usedComments[type].push(randomIndex);
                        updateInfoText();
                        return addRandomEmojis(comments[randomIndex]);
                    } else {
                        return "暂无可用评论";
                    }
                }
                
                const availableIndices = [];
                for (let i = 0; i < comments.length; i++) {
                    if (!used.includes(i)) {
                        availableIndices.push(i);
                    }
                }
                
                if (availableIndices.length === 0) {
                    usedComments[type] = [];
                    updateInfoText();
                    
                    if (comments.length > 0) {
                        const randomIndex = Math.floor(Math.random() * comments.length);
                        usedComments[type].push(randomIndex);
                        updateInfoText();
                        return addRandomEmojis(comments[randomIndex]);
                    } else {
                        return "暂无可用评论";
                    }
                }
                
                const randomIndex = Math.floor(Math.random() * availableIndices.length);
                const selectedIndex = availableIndices[randomIndex];
                usedComments[type].push(selectedIndex);
                updateInfoText();
                
                return addRandomEmojis(comments[selectedIndex]);
            }
            
            // 更新信息文本
            function updateInfoText() {
                if (!currentType) {
                    infoText.textContent = '请先选择类型';
                    return;
                }
                
                const remaining = getRemainingCount(currentType);
                const typeName = getDisplayName(currentType);
                infoText.textContent = `已选：${typeName}类型，剩余${remaining}条未使用`;
            }
            
            // 复制文本函数
            async function copyText(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } else {
                        const textArea = document.createElement('textarea');
                        textArea.value = text;
                        textArea.style.position = 'fixed';
                        textArea.style.left = '-999999px';
                        textArea.style.top = '-999999px';
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        
                        let success = false;
                        try {
                            success = document.execCommand('copy');
                        } catch (err) {
                            console.log('execCommand失败:', err);
                        }
                        
                        document.body.removeChild(textArea);
                        return success;
                    }
                } catch (err) {
                    console.log('复制失败:', err);
                    return false;
                }
            }
            
            // 处理类型选择
            function handleTypeSelect(type) {
                currentType = type;
                
                document.querySelectorAll('.type-btn').forEach(btn => {
                    if (btn.dataset.type === type) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                
                updateInfoText();
            }
            
            // 处理复制点击
            async function handleCopyClick() {
                if (!currentType) {
                    commentBox.textContent = '请先选择类型';
                    commentBox.classList.add('copy-success');
                    setTimeout(() => {
                        commentBox.classList.remove('copy-success');
                    }, 300);
                    return;
                }
                
                const comment = getUniqueComment(currentType);
                commentBox.textContent = comment;
                commentBox.classList.add('copy-success');
                setTimeout(() => {
                    commentBox.classList.remove('copy-success');
                }, 300);
                
                const success = await copyText(comment);
                if (success) {
                    copyBtn.classList.add('copied');
                    copyBtn.innerHTML = '✓ 复制成功';
                    
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = '点击复制评论';
                    }, 2000);
                } else {
                    copyBtn.innerHTML = '✗ 复制失败';
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = '点击复制评论';
                    }, 2000);
                }
            }
            
            // 移动端触摸事件处理
            function setupMobileTouchEvents(element, clickHandler) {
                if (!isMobile) return;
                
                element.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    this.style.transform = 'scale(0.95)';
                }, { passive: false });
                
                element.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    this.style.transform = '';
                    setTimeout(clickHandler, 10);
                }, { passive: false });
                
                element.addEventListener('touchcancel', function(e) {
                    e.preventDefault();
                    this.style.transform = '';
                }, { passive: false });
                
                element.addEventListener('focus', function(e) {
                    e.preventDefault();
                    this.blur();
                });
            }
            
            // 设置控制面板按钮事件
            function setupControlButtonEvents() {
                // 从URL加载按钮
                loadUrlBtn.addEventListener('click', async () => {
                    const url = urlInput.value.trim();
                    if (!url) {
                        updateStatus('请输入有效的URL');
                        return;
                    }
                    
                    await loadFromUrl(url);
                });
                
                setupMobileTouchEvents(loadUrlBtn, async () => {
                    const url = urlInput.value.trim();
                    if (!url) {
                        updateStatus('请输入有效的URL');
                        return;
                    }
                    
                    await loadFromUrl(url);
                });
                
                // 上传按钮
                uploadBtn.addEventListener('click', () => {
                    fileInput.click();
                });
                
                setupMobileTouchEvents(uploadBtn, () => {
                    fileInput.click();
                });
                
                // 文件输入变化事件
                fileInput.addEventListener('change', (e) => {
                    handleFileUpload(e.target.files);
                });
                
                // 自动加载本地文件按钮
                loadLocalBtn.addEventListener('click', () => {
                    loadLocalFiles();
                });
                
                setupMobileTouchEvents(loadLocalBtn, () => {
                    loadLocalFiles();
                });
                
                // 复制按钮
                copyBtn.addEventListener('click', () => {
                    handleCopyClick();
                });
                
                setupMobileTouchEvents(copyBtn, () => {
                    handleCopyClick();
                });
            }
            
            // 设置URL输入框事件
            function setupUrlInputEvents() {
                urlInput.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                }, { passive: true });
                
                urlInput.addEventListener('touchmove', function(e) {
                    e.stopPropagation();
                }, { passive: true });
                
                urlInput.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                }, { passive: true });
                
                urlInput.addEventListener('focus', function(e) {
                    // 不做任何阻止
                });
            }
            
            // 初始状态
            commentBox.textContent = '请选择一种方式加载评论文件';
            infoText.textContent = '请先加载评论文件并选择类型';
            updateStatus('请选择一种方式加载评论文件');
            
            // 设置事件
            setupControlButtonEvents();
            setupUrlInputEvents();
        });
    </script>
</body>
</html>
